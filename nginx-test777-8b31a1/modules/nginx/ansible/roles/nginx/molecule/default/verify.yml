---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nginx_config_files
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/default.conf
        - /tmp/molecule_test/etc/nginx/sites-available/default
        - /tmp/molecule_test/etc/nginx/sites-available/foo
        - /tmp/molecule_test/etc/nginx/sites-available/bar

    - name: Assert nginx configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "Nginx configuration file {{ item.item }} does not exist or is empty"
        success_msg: "Nginx configuration file {{ item.item }} exists and is not empty"
      loop: "{{ nginx_config_files.results }}"

    - name: Check nginx site symlinks exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nginx_symlinks
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/default
        - /tmp/molecule_test/etc/nginx/sites-enabled/foo
        - /tmp/molecule_test/etc/nginx/sites-enabled/bar

    - name: Assert nginx site symlinks exist and are valid
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "Nginx site symlink {{ item.item }} does not exist or is not a symlink"
        success_msg: "Nginx site symlink {{ item.item }} exists and is valid"
      loop: "{{ nginx_symlinks.results }}"

    - name: Check nginx configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content.content | b64decode)"
          - "'worker_connections 512' in (nginx_conf_content.content | b64decode)"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in (nginx_conf_content.content | b64decode)"
          - "'sendfile on' in (nginx_conf_content.content | b64decode)"
          - "'tcp_nopush on' in (nginx_conf_content.content | b64decode)"
          - "'tcp_nodelay on' in (nginx_conf_content.content | b64decode)"
          - "'keepalive_timeout 65' in (nginx_conf_content.content | b64decode)"
        fail_msg: "Nginx configuration does not contain expected settings"
        success_msg: "Nginx configuration contains expected settings"

    - name: Check site configuration content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item }}"
      register: site_conf_content
      loop:
        - foo
        - bar

    - name: Assert site configurations contain expected settings
      ansible.builtin.assert:
        that:
          - "'server {' in (item.content | b64decode)"
          - "'location /' in (item.content | b64decode)"
          - "'location /images/' in (item.content | b64decode)"
          - "'try_files $uri $uri/ /index.html' in (item.content | b64decode)"
        fail_msg: "Site configuration {{ item.item }} does not contain expected settings"
        success_msg: "Site configuration {{ item.item }} contains expected settings"
      loop: "{{ site_conf_content.results }}"

    - name: Check directory structure
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nginx_directories
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available
        - /tmp/molecule_test/etc/nginx/sites-enabled
        - /tmp/molecule_test/etc/nginx/conf.d
        - /tmp/molecule_test/var/log/nginx

    - name: Assert directory structure exists
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Directory {{ item.item }} does not exist"
        success_msg: "Directory {{ item.item }} exists"
      loop: "{{ nginx_directories.results }}"

    - name: Check EPEL repository file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/yum.repos.d/epel_ansible.repo
      register: epel_repo

    - name: Assert EPEL repository file exists
      ansible.builtin.assert:
        that:
          - epel_repo.stat.exists
          - epel_repo.stat.size > 0
        fail_msg: "EPEL repository file does not exist or is empty"
        success_msg: "EPEL repository file exists and is not empty"

    # The following tests would run on a real system but are tagged to be skipped in molecule
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service'].state == 'running'"
          - "ansible_facts.services['nginx.service'].status == 'enabled'"
        fail_msg: "Nginx service is not running or enabled"
        success_msg: "Nginx service is running and enabled"
      tags: molecule-notest

    - name: Test HTTP response
      ansible.builtin.uri:
        url: http://localhost
        return_content: true
      register: http_response
      tags: molecule-notest

    - name: Assert HTTP response is successful
      ansible.builtin.assert:
        that:
          - http_response.status == 200
        fail_msg: "HTTP response is not successful"
        success_msg: "HTTP response is successful"
      tags: molecule-notest