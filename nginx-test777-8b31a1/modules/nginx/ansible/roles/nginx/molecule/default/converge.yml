- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create the directories for nginx configuration
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/nginx
    - /tmp/molecule_test/etc/nginx/sites-available
    - /tmp/molecule_test/etc/nginx/sites-enabled
    - /tmp/molecule_test/etc/nginx/conf.d
    - /tmp/molecule_test/var/log/nginx
    - /tmp/molecule_test/var/run
    - /tmp/molecule_test/etc/yum.repos.d
    - /tmp/molecule_test/tmp/site1
    - /tmp/molecule_test/tmp/site2
  - name: Create mock nginx.conf
    ansible.builtin.copy:
      content: "# Mock nginx.conf\nuser nginx;\nworker_processes 2;\npid /var/run/nginx.pid;\n\nevents {\n    worker_connections 512;\n}\n\nhttp {\n    ssl_protocols
        TLSv1.2 TLSv1.3;\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    \n    access_log /var/log/nginx/access.log;\n    error_log
        /var/log/nginx/error.log;\n    \n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout 65;\n    \n    gzip on;\n    gzip_disable
        \"msie6\";\n    \n    include /etc/nginx/conf.d/*.conf;\n    include /etc/nginx/sites-enabled/*;\n}\n"
      dest: /tmp/molecule_test/etc/nginx/nginx.conf
      mode: '0644'
  - name: Create mock default.conf
    ansible.builtin.copy:
      content: '# Mock default.conf'
      dest: /tmp/molecule_test/etc/nginx/conf.d/default.conf
      mode: '0644'
  - name: Create mock default site
    ansible.builtin.copy:
      content: '# Mock default site'
      dest: /tmp/molecule_test/etc/nginx/sites-available/default
      mode: '0644'
  - name: Create symlink for default site
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/nginx/sites-available/default
      dest: /tmp/molecule_test/etc/nginx/sites-enabled/default
      state: link
  - name: Create mock site configurations
    ansible.builtin.copy:
      content: "server {\n    listen {{ item.listen }};\n    server_name {{ item.server_name }};\n    root {{ item.root }};\n    \n    location / {\n        try_files
        $uri $uri/ /index.html;\n    }\n    \n    location /images/ {\n        try_files $uri $uri/ /index.html;\n    }\n}\n"
      dest: /tmp/molecule_test/etc/nginx/sites-available/{{ item.file_name }}
      mode: '0644'
    loop:
    - file_name: foo
      listen: 8080
      server_name: localhost
      root: /tmp/molecule_test/tmp/site1
    - file_name: bar
      listen: 9090
      server_name: ansible
      root: /tmp/molecule_test/tmp/site2
  - name: Create symlinks for site configurations
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/nginx/sites-available/{{ item.file_name }}
      dest: /tmp/molecule_test/etc/nginx/sites-enabled/{{ item.file_name }}
      state: link
    loop:
    - file_name: foo
    - file_name: bar
  - name: Create mock epel.repo
    ansible.builtin.copy:
      content: '# Mock EPEL repository configuration

        [epel]

        name=Extra Packages for Enterprise Linux

        enabled=1

        gpgcheck=0

        '
      dest: /tmp/molecule_test/etc/yum.repos.d/epel_ansible.repo
      mode: '0644'
