---
argument_specs:
  main:
    short_description: Install and configure Nginx web server
    description:
      - This role installs and configures Nginx web server on RedHat and Debian-based systems.
      - It creates directory structure for site configurations and manages the Nginx service.
    options:
      nginx_max_clients:
        type: int
        default: 512
        description: Maximum number of simultaneous client connections
      nginx_http_params:
        type: dict
        default:
          sendfile: "on"
          tcp_nopush: "on"
          tcp_nodelay: "on"
          keepalive_timeout: "65"
        description: HTTP parameters for nginx configuration
      nginx_log_dir:
        type: str
        default: /var/log/nginx
        description: Directory for nginx log files
      nginx_access_log_name:
        type: str
        default: access.log
        description: Name of the access log file
      nginx_error_log_name:
        type: str
        default: error.log
        description: Name of the error log file
      nginx_separate_logs_per_site:
        type: bool
        default: false
        description: Whether to create separate log files for each site
      nginx_sites:
        type: list
        elements: dict
        description: List of site configurations to create
        default:
          - server:
              file_name: foo
              listen: 8080
              server_name: localhost
              root: /tmp/site1
              location1:
                name: /
                try_files: $uri $uri/ /index.html
              location2:
                name: /images/
                try_files: $uri $uri/ /index.html
          - server:
              file_name: bar
              listen: 9090
              server_name: ansible
              root: /tmp/site2
              location1:
                name: /
                try_files: $uri $uri/ /index.html
              location2:
                name: /images/
                try_files: $uri $uri/ /index.html
