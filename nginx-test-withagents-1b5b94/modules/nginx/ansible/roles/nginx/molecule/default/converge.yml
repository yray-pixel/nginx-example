---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create the base directories for nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/nginx
        - /tmp/molecule_test/etc/nginx/sites-available
        - /tmp/molecule_test/etc/nginx/sites-enabled
        - /tmp/molecule_test/etc/nginx/conf.d
        - /tmp/molecule_test/var/log/nginx
        - /tmp/molecule_test/var/run
        - /tmp/molecule_test/etc/yum.repos.d
        - /tmp/molecule_test/tmp/site1
        - /tmp/molecule_test/tmp/site2

    - name: Create mock nginx configuration files
      ansible.builtin.copy:
        content: |
          # Mock nginx.conf
          user nginx;
          worker_processes 2;
          pid /var/run/nginx.pid;
          events {
              worker_connections 512;
          }
          http {
              ssl_protocols TLSv1.2 TLSv1.3;
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              gzip on;
              gzip_disable "msie6";
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
        dest: "/tmp/molecule_test/etc/nginx/nginx.conf"
        mode: "0644"

    - name: Create mock default.conf
      ansible.builtin.copy:
        content: "# Mock default.conf"
        dest: "/tmp/molecule_test/etc/nginx/conf.d/default.conf"
        mode: "0644"

    - name: Create mock default site configuration
      ansible.builtin.copy:
        content: "# Mock default site configuration"
        dest: "/tmp/molecule_test/etc/nginx/sites-available/default"
        mode: "0644"

    - name: Create symbolic link for default site
      ansible.builtin.file:
        src: "/tmp/molecule_test/etc/nginx/sites-available/default"
        dest: "/tmp/molecule_test/etc/nginx/sites-enabled/default"
        state: link

    - name: Create mock site configurations
      ansible.builtin.copy:
        content: |
          server {
            listen {{ item.listen }};
            server_name {{ item.server_name }};
            root {{ item.root }};
            
            location / {
              try_files $uri $uri/ /index.html;
            }
            
            location /images/ {
              try_files $uri $uri/ /index.html;
            }
          }
        dest: "/tmp/molecule_test/etc/nginx/sites-available/{{ item.file_name }}"
        mode: "0644"
      loop:
        - file_name: foo
          listen: 8080
          server_name: localhost
          root: /tmp/site1
        - file_name: bar
          listen: 9090
          server_name: ansible
          root: /tmp/site2

    - name: Create symbolic links for site configurations
      ansible.builtin.file:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item.file_name }}"
        dest: "/tmp/molecule_test/etc/nginx/sites-enabled/{{ item.file_name }}"
        state: link
      loop:
        - file_name: foo
        - file_name: bar

    - name: Create mock EPEL repo file
      ansible.builtin.copy:
        content: |
          # Mock EPEL repository configuration
          [epel]
          name=Extra Packages for Enterprise Linux
          baseurl=http://download.fedoraproject.org/pub/epel/$releasever/$basearch/
          enabled=1
          gpgcheck=0
        dest: "/tmp/molecule_test/etc/yum.repos.d/epel_ansible.repo"
        mode: "0644"

    - name: Create mock pid file
      ansible.builtin.copy:
        content: "12345"
        dest: "/tmp/molecule_test/var/run/nginx.pid"
        mode: "0644"

    - name: Create mock log files
      ansible.builtin.copy:
        content: "# Mock log file"
        dest: "/tmp/molecule_test/var/log/nginx/{{ item }}"
        mode: "0644"
      loop:
        - access.log
        - error.log
        - localhost-access.log
        - localhost-error.log
        - ansible-access.log
        - ansible-error.log