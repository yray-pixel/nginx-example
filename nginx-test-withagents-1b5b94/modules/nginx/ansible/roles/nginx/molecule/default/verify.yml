---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify directory structure
    - name: Check if nginx directories exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/nginx/{{ item }}"
      register: nginx_dirs
      loop:
        - sites-available
        - sites-enabled
        - conf.d

    - name: Assert nginx directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Directory {{ item.invocation.module_args.path }} does not exist"
        success_msg: "Directory {{ item.invocation.module_args.path }} exists"
      loop: "{{ nginx_dirs.results }}"

    # Verify configuration files
    - name: Check if nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nginx_config_files
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/default.conf
        - /tmp/molecule_test/etc/nginx/sites-available/default
        - /tmp/molecule_test/etc/nginx/sites-available/foo
        - /tmp/molecule_test/etc/nginx/sites-available/bar

    - name: Assert nginx configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "Configuration file {{ item.invocation.module_args.path }} does not exist or is empty"
        success_msg: "Configuration file {{ item.invocation.module_args.path }} exists"
      loop: "{{ nginx_config_files.results }}"

    # Verify symbolic links
    - name: Check if nginx site symlinks exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nginx_symlinks
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/default
        - /tmp/molecule_test/etc/nginx/sites-enabled/foo
        - /tmp/molecule_test/etc/nginx/sites-enabled/bar

    - name: Assert nginx site symlinks exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "Symlink {{ item.invocation.module_args.path }} does not exist"
        success_msg: "Symlink {{ item.invocation.module_args.path }} exists"
      loop: "{{ nginx_symlinks.results }}"

    # Verify nginx.conf content
    - name: Get nginx.conf content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf

    - name: Assert nginx.conf contains expected configuration
      ansible.builtin.assert:
        that:
          - "'worker_processes' in nginx_conf.content | b64decode"
          - "'worker_connections' in nginx_conf.content | b64decode"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in nginx_conf.content | b64decode"
          - "'gzip on' in nginx_conf.content | b64decode"
        fail_msg: "nginx.conf does not contain expected configuration"
        success_msg: "nginx.conf contains expected configuration"

    # Verify site configurations
    - name: Get foo site configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/foo
      register: foo_site

    - name: Assert foo site configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'listen 8080' in foo_site.content | b64decode"
          - "'server_name localhost' in foo_site.content | b64decode"
          - "'root /tmp/site1' in foo_site.content | b64decode"
        fail_msg: "foo site configuration does not contain expected content"
        success_msg: "foo site configuration contains expected content"

    - name: Get bar site configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/bar
      register: bar_site

    - name: Assert bar site configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'listen 9090' in bar_site.content | b64decode"
          - "'server_name ansible' in bar_site.content | b64decode"
          - "'root /tmp/site2' in bar_site.content | b64decode"
        fail_msg: "bar site configuration does not contain expected content"
        success_msg: "bar site configuration contains expected content"

    # Verify EPEL repo file
    - name: Check if EPEL repo file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/yum.repos.d/epel_ansible.repo
      register: epel_repo

    - name: Assert EPEL repo file exists
      ansible.builtin.assert:
        that:
          - epel_repo.stat.exists
          - epel_repo.stat.size > 0
        fail_msg: "EPEL repo file does not exist or is empty"
        success_msg: "EPEL repo file exists"

    # Verify log files
    - name: Check if log files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/var/log/nginx/{{ item }}"
      register: log_files
      loop:
        - access.log
        - error.log

    - name: Assert log files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Log file {{ item.invocation.module_args.path }} does not exist"
        success_msg: "Log file {{ item.invocation.module_args.path }} exists"
      loop: "{{ log_files.results }}"

    # The following tests would be run on a real system but are tagged to be skipped in molecule
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service'].state == 'running'"
          - "ansible_facts.services['nginx.service'].status == 'enabled'"
        fail_msg: "Nginx service is not running or not enabled"
        success_msg: "Nginx service is running and enabled"
      tags: molecule-notest

    - name: Check if nginx is listening on configured ports
      ansible.builtin.wait_for:
        port: "{{ item }}"
        timeout: 1
      loop:
        - 8080
        - 9090
      ignore_errors: true
      register: port_check
      tags: molecule-notest

    - name: Assert nginx is listening on configured ports
      ansible.builtin.assert:
        that:
          - not item.failed
        fail_msg: "Nginx is not listening on port {{ item.port }}"
        success_msg: "Nginx is listening on port {{ item.port }}"
      loop: "{{ port_check.results }}"
      tags: molecule-notest

    - name: Test HTTP response from nginx sites
      ansible.builtin.uri:
        url: "http://localhost:{{ item }}"
        status_code: 200
      loop:
        - 8080
        - 9090
      register: http_check
      tags: molecule-notest

    - name: Assert HTTP responses are successful
      ansible.builtin.assert:
        that:
          - item.status == 200
        fail_msg: "HTTP request to port {{ item.url | regex_search(':\\d+') | regex_replace(':', '') }} failed"
        success_msg: "HTTP request to port {{ item.url | regex_search(':\\d+') | regex_replace(':', '') }} succeeded"
      loop: "{{ http_check.results }}"
      tags: molecule-notest