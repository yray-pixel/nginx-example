---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that mimics what the role would create
    - name: Create the directories for nginx configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/nginx
        - /tmp/molecule_test/etc/nginx/sites-available
        - /tmp/molecule_test/etc/nginx/sites-enabled
        - /tmp/molecule_test/etc/nginx/conf.d
        - /tmp/molecule_test/var/log/nginx
        - /tmp/molecule_test/etc/yum.repos.d
        - /tmp/molecule_test/tmp/site1
        - /tmp/molecule_test/tmp/site2

    # Create mock configuration files
    - name: Create mock nginx.conf file
      ansible.builtin.copy:
        content: |
          # Mock nginx.conf
          user nginx;
          worker_processes 1;
          pid /var/run/nginx.pid;
          
          events {
              worker_connections 512;
          }
          
          http {
              ssl_protocols TLSv1.2 TLSv1.3;
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              
              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;
              
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              
              gzip on;
              gzip_disable "msie6";
              
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
        dest: /tmp/molecule_test/etc/nginx/nginx.conf
        mode: "0644"

    - name: Create mock default.conf file
      ansible.builtin.copy:
        content: "# Mock default.conf"
        dest: /tmp/molecule_test/etc/nginx/conf.d/default.conf
        mode: "0644"

    - name: Create mock default site configuration
      ansible.builtin.copy:
        content: "# Mock default site configuration"
        dest: /tmp/molecule_test/etc/nginx/sites-available/default
        mode: "0644"

    # Create symlinks
    - name: Create symlink for default site
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/nginx/sites-available/default
        dest: /tmp/molecule_test/etc/nginx/sites-enabled/default
        state: link

    # Create site configurations based on nginx_sites variable
    - name: Create mock site configurations
      ansible.builtin.copy:
        content: |
          server {
              listen {{ item.server.listen }};
              server_name {{ item.server.server_name }};
              root {{ item.server.root }};
              
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              location /images/ {
                  try_files $uri $uri/ /index.html;
              }
          }
        dest: "/tmp/molecule_test/etc/nginx/sites-available/{{ item.server.file_name }}"
        mode: "0644"
      loop:
        - server:
            file_name: foo
            listen: 8080
            server_name: localhost
            root: /tmp/site1
        - server:
            file_name: bar
            listen: 9090
            server_name: ansible
            root: /tmp/site2

    # Create symlinks for site configurations
    - name: Create symlinks for site configurations
      ansible.builtin.file:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item.server.file_name }}"
        dest: "/tmp/molecule_test/etc/nginx/sites-enabled/{{ item.server.file_name }}"
        state: link
      loop:
        - server:
            file_name: foo
        - server:
            file_name: bar

    # Create mock EPEL repo file
    - name: Create mock EPEL repo file
      ansible.builtin.copy:
        content: |
          [epel]
          name=Extra Packages for Enterprise Linux
          baseurl=http://download.fedoraproject.org/pub/epel/$releasever/$basearch
          enabled=1
          gpgcheck=0
        dest: /tmp/molecule_test/etc/yum.repos.d/epel_ansible.repo
        mode: "0644"